name: Deployment Pipeline

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment for deployment'
        required: true
        type: string
      dry_run:
        description: 'Run deployment in dry-run mode'
        required: false
        type: boolean
        default: false
    secrets:
      deploy_key:
        description: 'Deployment credentials'
        required: false

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate environment
        run: |
          echo "Validating deployment to ${{ inputs.environment }}"
          
          # Validate environment parameter
          if [[ ! "${{ inputs.environment }}" =~ ^(development|staging|production)$ ]]; then
            echo "Error: Invalid environment. Must be one of: development, staging, production"
            exit 1
          fi
          
          echo "Environment validation passed"

      - name: Check deployment readiness
        run: |
          echo "Checking deployment readiness..."
          echo "Dry run mode: ${{ inputs.dry_run }}"
          echo "Deployment checks passed"

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment environment
        run: |
          echo "Setting up deployment environment: ${{ inputs.environment }}"
          echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV

      - name: Pre-deployment checks
        run: |
          echo "Running pre-deployment checks..."
          echo "Current branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"

      - name: Deploy application
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "DRY RUN: Would deploy to ${{ inputs.environment }}"
            echo "No actual deployment performed"
          else
            echo "Deploying to ${{ inputs.environment }}..."
            echo "Deployment completed successfully"
          fi

      - name: Post-deployment verification
        run: |
          echo "Verifying deployment..."
          echo "Deployment to ${{ inputs.environment }} verified successfully"

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
